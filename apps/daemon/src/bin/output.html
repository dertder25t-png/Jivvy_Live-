<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jivvy Live output</title>
<style>
  /* Runs offline on the church computer: system fonts only, nothing loaded from the network. */
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; user-select: none; }
  /* The slide is laid out at the output's canvas size, then scaled to fit with black bars. */
  #stage { position: absolute; left: 50%; top: 50%; background: #000; overflow: hidden; transform-origin: center; }
  #slide { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 0 6%; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; font-weight: 700; text-align: center;
           line-height: 1.2; overflow-wrap: anywhere; }
  /* An image slide fills the canvas, letterboxed; any text sits over it with a shadow. */
  #image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #image:not(.hidden) ~ #slide { text-shadow: 0 0 .25em #000, 0 .05em .1em #000; }
  #clock { font-variant-numeric: tabular-nums; margin-top: .3em; font-size: 1.6em; }
  #ident { position: absolute; left: 4%; bottom: 4%; color: rgba(244, 241, 234, .55);
           font-family: Consolas, ui-monospace, monospace; letter-spacing: .08em; }
  /* !important: #slide sets display by id, which would otherwise win over this class. */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage"><img id="image" class="hidden" alt=""><div id="slide" class="hidden"></div><div id="ident"></div></div>
<script>
  "use strict";
  const stage = document.getElementById("stage");
  const slide = document.getElementById("slide");
  const ident = document.getElementById("ident");
  const image = document.getElementById("image");
  const canvas = window.__jivvyCanvas || { w: 1920, h: 1080, label: "" };

  // The slide's text at 9% of the canvas height, smaller if that's what it takes for every
  // line to fit (run sheets allow 16 lines): shrunk, never cut off.
  function fitText() {
    let size = Math.round(canvas.h * 0.09);
    slide.style.fontSize = size + "px";
    // Too tall, or too wide (a word that can't break): smaller until it fits.
    // No floor: small canvases (an LED strip) get small text rather than text cut off.
    while ((slide.scrollHeight > canvas.h * 0.92 || slide.scrollWidth > slide.clientWidth) && size > 1) {
      size = Math.max(1, Math.floor(size * 0.92));
      slide.style.fontSize = size + "px";
    }
  }

  function fit() {
    const scale = Math.min(innerWidth / canvas.w, innerHeight / canvas.h);
    stage.style.width = canvas.w + "px";
    stage.style.height = canvas.h + "px";
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    fitText();
    ident.style.fontSize = Math.round(canvas.h * 0.025) + "px";
  }

  // Until the first state arrives, show which output this is (helps setup; never shown again).
  ident.textContent = `Jivvy Live · ${canvas.label || "Output"} · ${canvas.w}×${canvas.h}`;

  // A countdown slide's clock, ticking here so the engine never has to send the time.
  let countdownTo = null;
  let clock = null;
  function tick() {
    if (!clock || countdownTo === null) return;
    const s = Math.max(0, Math.ceil((countdownTo - Date.now()) / 1000));
    clock.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  setInterval(tick, 250);

  window.jivvy = {
    render(state) {
      ident.classList.add("hidden");
      slide.replaceChildren();
      // The run sheet's slide; with no run sheet set, the slide number.
      const lines = state.slide ? state.slide.lines : ["Slide " + (state.slideIndex + 1)];
      for (const text of lines) {
        const line = document.createElement("div");
        line.textContent = text;
        slide.append(line);
      }
      countdownTo = state.slide && state.slide.countdownTo !== undefined ? state.slide.countdownTo : null;
      clock = null;
      if (countdownTo !== null) {
        clock = document.createElement("div");
        clock.id = "clock";
        slide.append(clock);
        tick();
      }
      // Images come from this computer (see media_response in outputs.rs), never the network.
      const img = !state.black && state.slide && state.slide.image;
      if (img) {
        const src = (window.__jivvyMedia || "") + img;
        if (image.getAttribute("src") !== src) image.setAttribute("src", src);
      } else {
        image.removeAttribute("src");
      }
      image.classList.toggle("hidden", !img);
      slide.classList.toggle("hidden", state.black);
      fitText();
    },
  };

  addEventListener("resize", fit);
  fit();
  window.ipc.postMessage("ready");
</script>
</body>
</html>
