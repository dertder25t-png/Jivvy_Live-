name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  daemon:
    # The daemon targets Windows first; Linux keeps it portable. Camera/audio input
    # (the `video` feature) needs GStreamer, installed here on Linux only for now.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: ""
          - os: ubuntu-latest
            features: "--features video"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/daemon
    steps:
      - uses: actions/checkout@v4
      # Output windows (tao + wry) build against GTK and WebKitGTK; video needs GStreamer
      # with the base (test sources, audioconvert) and good (level) plugins.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/daemon
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets ${{ matrix.features }} -- -D warnings
      # Includes the chaos tests: engine kills, hangs and corruption, output windows run
      # headless, and (with video) camera/audio on GStreamer test sources.
      - run: cargo test --release ${{ matrix.features }}
