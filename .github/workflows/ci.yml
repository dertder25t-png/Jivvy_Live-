name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  daemon:
    # The daemon targets Windows first; Linux keeps it portable.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/daemon
    steps:
      - uses: actions/checkout@v4
      # The output windows (tao + wry) build against GTK and WebKitGTK on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/daemon
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      # Includes the chaos tests: engine kills, hangs and corruption, plus the output windows run headless.
      - run: cargo test --release
