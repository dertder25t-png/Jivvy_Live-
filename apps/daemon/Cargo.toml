[package]
name = "jivvy-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "jivvy_daemon"
path = "src/lib.rs"

[[bin]]
name = "jivvy-watchdog"
path = "src/bin/watchdog.rs"

[[bin]]
name = "jivvy-engine"
path = "src/bin/engine.rs"

[[bin]]
name = "jivvy-outputs"
path = "src/bin/outputs.rs"

# One-line commands to a running daemon: jivvy-ctl next, jivvy-ctl state, ...
[[bin]]
name = "jivvy-ctl"
path = "src/bin/ctl.rs"

# Camera and audio input. Needs GStreamer installed, so it is opt-in: --features video.
[[bin]]
name = "jivvy-video"
path = "src/bin/video/main.rs"
required-features = ["video"]

[features]
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Lets a release build go without JIVVY_LICENSE_PUBLIC_KEY (build.rs). For CI and test builds
# only: such a build accepts no license keys. Never ship one.
unlicensed-release = []

[dependencies]
ab_glyph = "0.2"
# Device keys: base64url on the wire, P-256 signatures checked with ring (already used by rustls).
base64 = "0.22"
fs4 = "1.1.0"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
# TLS for the WebSocket channel (wss) with the church's certificate; ring, already used by ureq.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The library (songs, plans, themes, settings): SQLite compiled in, nothing to install.
rusqlite = { version = "0.37", features = ["bundled"] }
# The command channel over WebSocket (same envelopes as the TCP one).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# HTTP: YouTube's HLS segment upload, and the pre-flight upload test.
ureq = { version = "3", default-features = false, features = ["rustls"] }
wry = "0.57"
# Web push alerts to the tech lead: the RFC 8291 payload encryption (MIT OR Apache-2.0, pure
# Rust). VAPID is signed with ring above, so its optional JWT dependency stays off.
web-push-native = { version = "0.5", default-features = false }

[dev-dependencies]
# Test certificates for the wss tests.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
socket2 = "0.6"

# The chaos tests put themselves in a job object so a killed test run can't leave daemons behind.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
